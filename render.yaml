services:
  - type: web
    name: business-card-website
    env: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-store 