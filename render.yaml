services:
  - type: web
    name: business-card-website
    env: node
    buildCommand: npm install && npm run build
    startCommand: cd build && NODE_ENV=production node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: VIBER_AUTH_TOKEN
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    headers:
      - path: /*
        name: Access-Control-Allow-Credentials
        value: "true"
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*" 