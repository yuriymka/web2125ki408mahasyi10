services:
  - type: web
    name: business-card-website
    env: node
    buildCommand: npm install && npm run build
    startCommand: cd build && NODE_ENV=production node server.js
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true 