<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - AJAX Forms</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Home</a>
            <a href="/get-page">GET Page</a>
            <a href="/post-page">POST Page</a>
            <a href="/ajax-forms">AJAX Forms</a>
        </nav>
        
        <div class="card">
            <h2>AJAX Forms Demo</h2>
            
            <div class="form-section">
                <h3>GET AJAX Form</h3>
                <form id="getAjaxForm">
                    <input type="text" name="name" placeholder="Enter your name">
                    <button type="submit">Submit GET AJAX Request</button>
                </form>
                <div id="getResult" class="result"></div>
            </div>

            <div class="form-section">
                <h3>POST AJAX Form</h3>
                <form id="postAjaxForm">
                    <input type="text" name="name" placeholder="Enter your name">
                    <button type="submit">Submit POST AJAX Request</button>
                </form>
                <div id="postResult" class="result"></div>
            </div>

            <div class="timestamp">Page loaded at: <span id="loadTime"></span></div>
        </div>
    </div>

    <script src="/js/ajax.js"></script>
    <script>
        document.getElementById('loadTime').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
