<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Business Card</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Login</h2>
            <div id="errorMessage" class="error"></div>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-group" id="totpGroup">
                    <input type="text" name="token" placeholder="2FA Code (6 digits)" pattern="[0-9]{6}">
                    <small>Enter the 6-digit code from Google Authenticator</small>
                </div>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="/register">Register</a></p>
        </div>
    </div>

    <!-- Add verification code section -->
    <div id="verificationSection" style="display: none;">
        <h3>Verify Login</h3>
        <p>We've sent a verification code to your Viber account.</p>
        <div class="form-group">
            <input type="text" id="verificationCode" placeholder="Enter 6-digit code">
        </div>
        <button onclick="verifyLogin()">Verify</button>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const totpGroup = document.getElementById('totpGroup');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';

            const formData = new FormData(e.target);
            const data = {
                username: formData.get('username'),
                password: formData.get('password'),
                token: formData.get('token')
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'same-origin' // Important for session handling
                });

                const result = await response.json();
                console.log('Login response:', result);

                if (result.success) {
                    window.location.href = '/'; // Redirect to home page
                } else if (result.requires2FA) {
                    errorMessage.textContent = 'Please enter your 2FA code';
                    errorMessage.style.display = 'block';
                    totpGroup.style.display = 'block';
                } else {
                    errorMessage.textContent = result.error || 'Login failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.style.display = 'block';
            }
        });

        async function verifyLogin() {
            const code = document.getElementById('verificationCode').value;
            
            try {
                const response = await fetch('/api/verify-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = result.error || 'Verification failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
