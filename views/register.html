<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Business Card</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .qr-container {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .secret-key {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            margin: 10px 0;
            word-break: break-all;
        }
        .verification-form {
            display: none;
        }
        .error {
            color: #dc3545;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Register</h2>
            <div id="errorMessage" class="error"></div>
            
            <!-- Registration Form -->
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit">Register</button>
            </form>

            <!-- 2FA Setup Section -->
            <div id="setup2FA" class="qr-container">
                <h3>Set Up Two-Factor Authentication</h3>
                <p>1. Install Google Authenticator on your phone</p>
                <ul>
                    <li><a href="https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2" target="_blank">Android - Google Play Store</a></li>
                    <li><a href="https://apps.apple.com/us/app/google-authenticator/id388497605" target="_blank">iPhone - App Store</a></li>
                </ul>
                <p>2. Scan this QR code:</p>
                <div id="qrcode"></div>
                <p>Or enter this code manually:</p>
                <div id="secret" class="secret-key"></div>
                
                <!-- Verification Form -->
                <form id="verifyForm" class="verification-form">
                    <div class="form-group">
                        <input type="text" name="token" placeholder="Enter 6-digit code" pattern="[0-9]{6}" required>
                    </div>
                    <button type="submit">Verify and Complete Setup</button>
                </form>
            </div>

            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const setup2FA = document.getElementById('setup2FA');
        const verifyForm = document.getElementById('verifyForm');
        const errorMessage = document.getElementById('errorMessage');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            
            const formData = new FormData(e.target);
            if (formData.get('password') !== formData.get('confirmPassword')) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    // Show 2FA setup
                    registerForm.style.display = 'none';
                    setup2FA.style.display = 'block';
                    verifyForm.style.display = 'block';
                    
                    // Display QR code and secret
                    document.getElementById('qrcode').innerHTML = `<img src="${data.qrCode}" alt="QR Code">`;
                    document.getElementById('secret').textContent = data.secret;
                } else {
                    errorMessage.textContent = data.error || 'Registration failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.style.display = 'block';
            }
        });

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';

            try {
                const response = await fetch('/api/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: e.target.elements.token.value
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || 'Invalid code. Please try again.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Verification error:', error);
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
