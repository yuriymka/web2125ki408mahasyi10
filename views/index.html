<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Home</a>
            <a href="/get-page">GET Page</a>
            <a href="/post-page">POST Page</a>
            <a href="/ajax-forms">AJAX Forms</a>
            <a href="/api/logout" id="logoutLink">Logout</a>
        </nav>
        
        <div class="card">
            <h1>Welcome to Business Card</h1>
            <div id="userInfo"></div>
            <div class="timestamp">Page loaded at: <span id="loadTime"></span></div>
        </div>
    </div>

    <script>
        document.getElementById('loadTime').textContent = new Date().toLocaleString();

        // Check session status
        fetch('/api/session-check')
            .then(response => response.json())
            .then(data => {
                if (data.isAuthenticated && data.user) {
                    document.getElementById('userInfo').innerHTML = `
                        <p>Welcome, ${data.user.username}!</p>
                    `;
                }
            })
            .catch(error => console.error('Session check error:', error));
    </script>
</body>
</html>
